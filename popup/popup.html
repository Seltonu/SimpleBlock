<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="popup.css">
  <script src="../shared/theme.js"></script>
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header class="topbar">
    <img class="brand-icon" src="../icons/simpleblock-48.png" alt="" width="24" height="24">
    <h1 class="brand">SimpleBlock</h1>
    <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 19.8 19.8 4.2"/><path d="M16.6 7.4a6.5 6.5 0 0 0-9.2 9.2"/><path d="M12 1.8v2.2M1.8 12H4M4.8 4.8l1.55 1.55"/></g><path d="M16.6 7.4a6.5 6.5 0 0 1-9.2 9.2z" fill="currentColor"/></svg>
    </button>
    <!-- Sits in the header's spare space, so showing it never resizes the popup. -->
    <p class="paused-note" id="paused-note" role="status"></p>
    <label class="switch switch--master" title="Pause or resume all blocking">
      <input type="checkbox" id="master" role="switch" checked>
      <span class="switch-track" aria-hidden="true"></span>
      <span class="switch-text">Blocking</span>
    </label>
  </header>

  <main class="workspace">
    <div class="tabbar">
      <div class="tabs" id="tabs" role="tablist" aria-label="Categories"></div>
      <button class="tab-add" id="add-ruleset" type="button" title="New category" aria-label="New category">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <section class="panel" id="panel" role="tabpanel">
      <div class="panel-head">
        <input class="ruleset-name" id="ruleset-name" type="text" aria-label="Category name" spellcheck="false" maxlength="40">
        <label class="switch" title="Turn this category on or off">
          <input type="checkbox" id="ruleset-enabled" role="switch">
          <span class="switch-track" aria-hidden="true"></span>
          <span class="switch-text">Active</span>
        </label>
        <button class="icon-btn icon-btn--danger" id="delete-ruleset" type="button" title="Delete category" aria-label="Delete category">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="confirm-text">Delete?</span>
        </button>
      </div>

      <div class="rule-columns" aria-hidden="true"><span class="col-block">Block</span><span class="col-redirect">Redirect to</span></div>

      <ul class="rules" id="rules"></ul>
      <p class="empty">No rules yet. Add one below.</p>
      <p class="no-rulesets" id="no-rulesets" hidden>No categories yet. Click <strong>+</strong> to add one.</p>
    </section>
  </main>

  <footer class="bottombar">
    <button class="btn btn--ghost btn--icon" id="settings" type="button" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></g></svg>
    </button>
    <button class="btn btn--ghost" id="help" type="button">Help</button>
    <a class="version" id="version" href="https://github.com/Seltonu/SimpleBlock" title="SimpleBlock on GitHub"></a>
    <button class="btn btn--primary" id="add-rule" type="button">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Add rule
    </button>
  </footer>

  <template id="tab-template">
    <button class="tab" type="button" role="tab">
      <span class="tab-dot" aria-hidden="true"></span><span class="tab-name"></span><span class="tab-count"></span>
    </button>
  </template>

  <template id="rule-template">
    <li class="rule">
      <label class="rule-check" title="Use this rule"><input type="checkbox"></label>
      <input class="field field--block" type="text" placeholder="example.com" spellcheck="false" autocomplete="off">
      <span class="rule-arrow" aria-hidden="true"><svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 8h9.5M9 4.5 12.5 8 9 11.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <input class="field field--redirect" type="text" placeholder="SimpleBlock" spellcheck="false" autocomplete="off">
      <button class="icon-btn rule-remove" type="button" title="Remove rule"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      <p class="rule-error" hidden></p>
      <p class="rule-hint" hidden></p>
    </li>
  </template>
</body>
</html>
